[project]
name = "ai-evaluation-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<0.29",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=5,<7",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["ruff>=0.9,<1", "mypy>=1.14,<2"]
test = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "playwright>=1.50,<2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
plugins = ['pydantic.mypy']
python_version = "3.12"
strict = true
files = ["app", "tests", "trace_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
