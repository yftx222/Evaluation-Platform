name: ai-evaluation
x-api: &api
  image: ai-evaluation-api:local
  environment:
    EVAL_DATABASE_URL: postgresql+asyncpg://eval:${POSTGRES_PASSWORD:?set a URL-safe local password}@postgres:5432/eval
    EVAL_REDIS_URL: redis://redis:6379/0
    EVAL_MODE: development
    EVAL_REPORT_POLICIES: ${EVAL_REPORT_POLICIES:-{}}
    EVAL_TRACE_RETENTION_DAYS: ${EVAL_TRACE_RETENTION_DAYS:-null}
    EVAL_IDENTITIES: ${EVAL_IDENTITIES:-[]}
    EVAL_JUDGE_ACCOUNTS: ${EVAL_JUDGE_ACCOUNTS:-{}}
    EVAL_TARGETS: ${EVAL_TARGETS:-{}}
    EVAL_SECRETS: ${EVAL_SECRETS:-{}}
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eval
      POSTGRES_DB: eval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a URL-safe local password}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "eval", "-d", "eval"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *api
    command: ["alembic","upgrade","head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: ./backend
    <<: *api
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:18000:8000"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/ready',timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 10
  worker:
    image: ai-evaluation-api:local
    profiles: ["scheduler"]
    command: ["python", "-m", "app.worker.main"]
    environment:
      EVAL_DATABASE_URL: postgresql+asyncpg://eval:${POSTGRES_PASSWORD:?set a URL-safe local password}@postgres:5432/eval
      EVAL_REDIS_URL: redis://redis:6379/0
      EVAL_MODE: development
      EVAL_TARGETS: ${EVAL_TARGETS:-{}}
      EVAL_SECRETS: ${EVAL_SECRETS:-{}}
      EVAL_JUDGE_ACCOUNTS: ${EVAL_JUDGE_ACCOUNTS:-{}}
      EVAL_TRACE_TARGET_VERSIONS: ${EVAL_TRACE_TARGET_VERSIONS:-[]}
      EVAL_VERIFIED_IDEMPOTENT_VERSIONS: ${EVAL_VERIFIED_IDEMPOTENT_VERSIONS:-[]}
      EVAL_WORKER_SLOTS: ${EVAL_WORKER_SLOTS:-4}
      EVAL_WORKER_GLOBAL_SLOTS: ${EVAL_WORKER_GLOBAL_SLOTS:-16}
      EVAL_WORKER_BATCH: ${EVAL_WORKER_BATCH:-4}
      EVAL_WORKER_POLL_S: ${EVAL_WORKER_POLL_S:-1}
      EVAL_WORKER_LEASE_S: ${EVAL_WORKER_LEASE_S:-30}
      EVAL_WORKER_HEARTBEAT_S: ${EVAL_WORKER_HEARTBEAT_S:-5}
      EVAL_WORKER_SHUTDOWN_S: ${EVAL_WORKER_SHUTDOWN_S:-5}
    depends_on:
      migrate: {condition: service_completed_successfully}
  frontend:
    build: ./frontend-ios
    ports: ["127.0.0.1:15173:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD","wget","-q","-O","/dev/null","http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
  redisdata:
